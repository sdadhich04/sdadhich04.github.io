name: Build, check and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      # R30: broken internal links fail the build; external failures are only reported.
      - name: Link check (internal, blocking)
        run: npm run check:links

      - name: Link check (external, report only)
        continue-on-error: true
        run: npm run check:links:external

      # R10/R22: performance >= 0.90 and accessibility >= 0.95 on / and one project page.
      - name: Lighthouse CI (mobile)
        run: npm run lhci:mobile

      - name: Lighthouse CI (desktop)
        run: npm run lhci:desktop

      - name: Lighthouse scores
        if: always()
        run: |
          node -e '
          const fs = require("fs");
          const rows = ["| Profile | Page | Performance | Accessibility | Best practices | SEO |", "|---|---|---|---|---|---|"];
          for (const profile of ["mobile", "desktop"]) {
            const dir = ".lighthouseci/" + profile;
            if (!fs.existsSync(dir)) continue;
            for (const f of fs.readdirSync(dir).filter((f) => f.endsWith(".report.json")).sort()) {
              const j = JSON.parse(fs.readFileSync(dir + "/" + f, "utf8"));
              const s = (c) => Math.round(j.categories[c].score * 100);
              rows.push(`| ${profile} | ${new URL(j.finalDisplayedUrl).pathname} | ${s("performance")} | ${s("accessibility")} | ${s("best-practices")} | ${s("seo")} |`);
            }
          }
          const out = rows.join("\n");
          console.log(out);
          if (process.env.GITHUB_STEP_SUMMARY) fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, "### Lighthouse\n\n" + out + "\n");
          '

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lighthouse-reports
          path: .lighthouseci/
          include-hidden-files: true
          retention-days: 14

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: _site

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
