<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 330" width="100%" role="img" aria-labelledby="emgloop-t emgloop-d" style="font-family:Inter, system-ui, sans-serif">
<title id="emgloop-t">EMG BCI: the loop ran at about 120 ms, so the real lags were longer than set</title><desc id="emgloop-d">Per-loop period in each lag run, 10th to 90th percentile with the median marked, against the nominal 100 ms. Medians: 0 ms run 120 ms, ≈125 ms run 125 ms, ≈360 ms run 119 ms, ≈590 ms run 118 ms. Because lag is set in whole loops (1, 3 and 5), the added lags were about 125, 360 and 590 ms instead of 100, 300 and 500 ms.</desc>
