<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 212" width="100%" role="img" aria-labelledby="botpkt-t botpkt-d" style="font-family:Inter, system-ui, sans-serif">
<title id="botpkt-t">BackOnTrack: the 72-byte BLE telemetry packet</title><desc id="botpkt-d">One packed, little-endian 72-byte notification every 50 milliseconds, 20 per second, on the sensor characteristic. Bytes 0 to 3: uptime in milliseconds. Bytes 4 to 31: the upper IMU as seven floats, pitch, roll, yaw and the quaternion i, j, k, r. Bytes 32 to 59: the same seven floats for the lower IMU, all zero while it is disabled. Bytes 60 to 67: EMG filtered ADC value and millivolts. Byte 68: status flags, bit 0 upper IMU valid, bit 1 lower IMU valid, bit 2 EMG valid, bit 3 calibrated. Byte 69: sequence number, so the receiver can count dropped packets. Bytes 70 to 71: raw EMG ADC. The packet carries raw values only; classification stays on the device.</desc>
<defs><marker id="botpkt-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#F2E9E4" fill-opacity=".7"/></marker></defs>
<rect x="10" y="44" width="82" height="44" fill="#000000" stroke="#F2E9E4" stroke-opacity="0.35"/>
<text x="18" y="62" fill="#F2E9E4" font-size="11.5" font-weight="600">uptime ms</text>
<text x="18" y="78" fill="#8C877D" font-family="JetBrains Mono, ui-monospace, monospace" font-size="9.5">4 B · uint32</text>
<text x="10" y="38" fill="#8C877D" font-family="JetBrains Mono, ui-monospace, monospace" font-size="9">0</text>
<rect x="92" y="44" width="228" height="44" fill="#000000" stroke="#E8483A" stroke-opacity="1"/>
