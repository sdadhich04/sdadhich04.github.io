<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 356" width="100%" role="img" aria-labelledby="botgrav-t botgrav-d" style="font-family:Inter, system-ui, sans-serif">
<title id="botgrav-t">BackOnTrack: lean measured from the gravity vector, not Euler angles</title><desc id="botgrav-d">The BNO085 quaternion gives the direction of gravity in the sensor frame. At calibration the firmware stores that direction as the neutral vector g0 and builds a right axis and a forward axis from it. Each frame it projects the live gravity direction g onto those axes: forward lean is the angle of g in the forward-up plane, lateral lean its angle in the right-up plane, and total lean the angle between g and g0. Everything is a difference from the neutral vector, so the sensor's sign convention and mounting angle drop out. The decomposition holds until the body tilts about 90 degrees from neutral.</desc>
<defs><marker id="botgrav-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#F2E9E4" fill-opacity=".7"/></marker></defs>
<path d="M120,200 L120,60" fill="none" stroke="#F2E9E4" stroke-opacity="0.6" stroke-width="1.4" marker-end="url(#botgrav-a)"/>
<path d="M120,200 L240,200" fill="none" stroke="#F2E9E4" stroke-opacity="0.6" stroke-width="1.4" marker-end="url(#botgrav-a)"/>
<path d="M120,200 L58,244" fill="none" stroke="#F2E9E4" stroke-opacity="0.6" stroke-width="1.4" marker-end="url(#botgrav-a)"/>
<path d="M192.06901993571586,84.66545892272607 V200 M192.06901993571586,84.66545892272607 H120" fill="none" stroke="#E8483A" stroke-opacity=".5" stroke-dasharray="3 3"/>
<path d="M120,200 L192.06901993571586,84.66545892272607" fill="none" stroke="#E8483A" stroke-opacity="1" stroke-width="2" marker-end="url(#botgrav-a)"/>
<path d="M120,144 A56,56 0 0 1 149.67547879705947,152.50930661524015" fill="none" stroke="#E8483A" stroke-width="1.2"/>
<text x="134" y="134" fill="#E8483A" font-family="JetBrains Mono, ui-monospace, monospace" font-size="11">fwd</text>
<text x="128" y="56" text-anchor="start" fill="#F2E9E4" font-size="11.5">g0 · neutral</text>
<text x="128" y="70" text-anchor="start" fill="#9C9389" font-size="10">stored at calibration</text>
<text x="244" y="204" text-anchor="start" fill="#F2E9E4" font-size="11">fwd</text>
<text x="192" y="218" text-anchor="start" fill="#9C9389" font-size="10">= right × g0</text>
<text x="54" y="260" text-anchor="start" fill="#9C9389" font-size="10">right = g0 × ref</text>
<text x="200.06901993571586" y="86.66545892272607" text-anchor="start" fill="#E8483A" font-size="11.5">g · live gravity</text>
<text x="200.06901993571586" y="100.66545892272607" text-anchor="start" fill="#9C9389" font-size="10">from the quaternion</text>
<text x="126" y="188" text-anchor="start" fill="#9C9389" font-size="10">du = g·g0</text>
<text x="196.06901993571586" y="192" text-anchor="start" fill="#9C9389" font-size="10">df = g·fwd</text>
<text x="296" y="52" text-anchor="start" fill="#8C877D" font-size="10.5">EACH FRAME</text>
<text x="296" y="74" text-anchor="start" fill="#F2E9E4" font-size="11.5">forward = atan2(df, du)</text>
<text x="296" y="92" text-anchor="start" fill="#F2E9E4" font-size="11.5">lateral = atan2(dr, du)</text>
<text x="296" y="110" text-anchor="start" fill="#F2E9E4" font-size="11.5">total   = acos(du)</text>
<text x="296" y="136" text-anchor="start" fill="#9C9389" font-size="10.5">all three are differences</text>
<text x="296" y="150" text-anchor="start" fill="#9C9389" font-size="10.5">from the neutral vector, so</text>
<text x="296" y="164" text-anchor="start" fill="#9C9389" font-size="10.5">sign convention and mounting</text>
<text x="296" y="178" text-anchor="start" fill="#9C9389" font-size="10.5">angle drop out</text>
<text x="296" y="202" text-anchor="start" fill="#9C9389" font-size="10.5">valid until the body tilts</text>
<text x="296" y="216" text-anchor="start" fill="#9C9389" font-size="10.5">about 90° from neutral</text>
<line x1="20" y1="276" x2="440" y2="276" stroke="#F2E9E4" stroke-opacity=".14"/>
<text x="20" y="296" text-anchor="start" fill="#8C877D" font-size="10">BEFORE · EULER</text>
<text x="20" y="311" text-anchor="start" fill="#9C9389" font-size="10.5">pitch − pitch0, roll − roll0 · sign and mount dependent · 15° / 30° / ±10°</text>
<text x="20" y="332" text-anchor="start" fill="#E8483A" font-size="10">AFTER · GRAVITY (10 JUN 2026)</text>
<text x="20" y="347" text-anchor="start" fill="#9C9389" font-size="10.5">angles between vectors · sign-free · 10° / 25° / ±12° / 14°</text>
</svg>