<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 592" width="100%" role="img" aria-labelledby="shsys-t shsys-d" style="font-family:Inter, system-ui, sans-serif">
<title id="shsys-t">Project SHIELD: system diagram of the DAQ board</title><desc id="shsys-d">Redrawn from the capstone poster's Figure 1. A 9 volt battery feeds a 9 to 5 volt converter; 5 volts powers the ESP32-S3 board, the microSD module and the current sensor, and the ESP32-S3 supplies 3.3 volts to the other modules. Inside the ESP32-S3, raw sensor data is scaled and converted, tagged with metadata (sensor type, unit ID, model, sampling rate, timestamp reference and run ID) and buffered. The sensor modules, tested one at a time on five units each, are an IMU (BNO085, SPI: accelerometer, gyroscope, magnetometer), a pressure sensor (MPL3115A2, I2C), a temperature sensor (MCP9808, I2C), a microphone (INMP441, I2S), a photodiode and a current sensor (ACS723) read through an ADS1115 analog-to-digital converter on I2C, and a vibration switch (SW-420, GPIO). Data goes to a microSD card over SPI as binary sensor files plus JSON metadata, and to a host PC over USB serial; a Wi-Fi web view exists but is compiled off by default.</desc>
