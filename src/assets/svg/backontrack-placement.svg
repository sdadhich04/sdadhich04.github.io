<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 430" width="100%" role="img" aria-labelledby="botplace-t botplace-d" style="font-family:Inter, system-ui, sans-serif">
<title id="botplace-t">BackOnTrack: where the sensors sit on the back</title><desc id="botplace-d">Back view of a person. The main module, an ESP32-S3 with the upper BNO085 IMU, sits between the shoulder blades on the strap; it samples the IMU at 50 hertz over SPI. A MyoWare 2.0 EMG sensor sits on the upper trapezius with three gel electrodes and is read by the ESP32-S3's ADC at 100 hertz. A second BNO085 in the lower strap pocket near the lumbar region is part of the team's design and is configured in the firmware, but is disabled at runtime because the bundled driver supports one sensor. Vibration alerts and the companion app over BLE complete the manual's design.</desc>
