<title id="emg-t">EMG cursor BCI: successful reaches and failed center holds versus added feedback lag</title><desc id="emg-d">Successful reaches out of 19 attempts, by measured added lag (script setting in brackets): 0 ms (0): 10, about 125 ms (100): 16, about 360 ms (300): 2, about 590 ms (500): 4. Failed center holds: 0 ms: 4, about 125 ms: 5, about 360 ms: 49, about 590 ms: 78. One run per lag condition; the loop ran about 0.12 s instead of the nominal 0.1 s, so the settings of 100, 300 and 500 ms gave about 125, 360 and 590 ms.</desc>
