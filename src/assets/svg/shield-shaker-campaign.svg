<text x="288.75" y="158" text-anchor="middle" fill="#9C9389" font-family="JetBrains Mono, ui-monospace, monospace" font-size="10" letter-spacing="1">medium</text>
<rect x="350.2" y="62" width="92.1" height="78" fill="none" stroke="#F2E9E4" stroke-opacity=".6"/>
<path d="M342.5,140 H350.2 M442.3,140 H450.0" stroke="#F2E9E4" stroke-opacity=".35" stroke-width="3"/>
<text x="396.25" y="158" text-anchor="middle" fill="#9C9389" font-family="JetBrains Mono, ui-monospace, monospace" font-size="10" letter-spacing="1">high</text>
<path d="M20,140 H450" fill="none" stroke="#F2E9E4" stroke-opacity=".45" stroke-width="1.2"/>
<path d="M20.0,140 V144" stroke="#F2E9E4" stroke-opacity=".45"/>
<text x="20.0" y="174" text-anchor="middle" fill="#8C877D" font-family="JetBrains Mono, ui-monospace, monospace" font-size="9.5" letter-spacing="1">0</text>
<path d="M127.5,140 V144" stroke="#F2E9E4" stroke-opacity=".45"/>
<text x="127.5" y="174" text-anchor="middle" fill="#8C877D" font-family="JetBrains Mono, ui-monospace, monospace" font-size="9.5" letter-spacing="1">70</text>
<path d="M235.0,140 V144" stroke="#F2E9E4" stroke-opacity=".45"/>
<text x="235.0" y="174" text-anchor="middle" fill="#8C877D" font-family="JetBrains Mono, ui-monospace, monospace" font-size="9.5" letter-spacing="1">140</text>
