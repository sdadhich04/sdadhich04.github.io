<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 240" width="100%" role="img" aria-labelledby="shshake-t shshake-d" style="font-family:Inter, system-ui, sans-serif">
<title id="shshake-t">Project SHIELD: the four-session shaker campaign</title><desc id="shshake-d">Four back-to-back 70-minute sessions at low, medium, medium and high speed, 280 minutes in all. Each session is 5 minutes settling with the shaker off, 60 minutes at the target speed and 5 minutes of recovery. One button press on the board arms the first session; after that the board follows the PC script's zero-gap chaining for sessions 2 to 4. The A1 protocol's speeds are 80, 140 and 200 RPM.</desc>
<defs><marker id="shshake-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#F2E9E4" fill-opacity=".7"/></marker></defs>
<text x="10" y="16" text-anchor="start" fill="#8C877D" font-family="JetBrains Mono, ui-monospace, monospace" font-size="10.5" letter-spacing="1">4 SESSIONS × 70 MIN, ONE BUTTON PRESS</text>
<rect x="27.7" y="114" width="92.1" height="26" fill="none" stroke="#F2E9E4" stroke-opacity=".6"/>
