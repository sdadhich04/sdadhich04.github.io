<text x="450" y="40" text-anchor="end" fill="#8C877D" font-family="JetBrains Mono, ui-monospace, monospace" font-size="9.5" letter-spacing="1">PC script chains 2–4, zero gap</text>
<text x="10" y="212" text-anchor="start" fill="#9C9389" font-size="11">Each session: 5 min settle (off) · 60 min at speed · 5 min recovery.</text>
