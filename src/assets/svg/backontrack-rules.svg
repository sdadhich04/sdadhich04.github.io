<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 404" width="100%" role="img" aria-labelledby="botrules-t botrules-d" style="font-family:Inter, system-ui, sans-serif">
<title id="botrules-t">BackOnTrack: the posture rules as a map of forward and lateral lean</title><desc id="botrules-d">Left, a map with forward lean on the horizontal axis and lateral lean on the vertical axis, both measured from the calibrated neutral. Forward lean of 25 degrees or more is Leaning Forward; 10 to 25 degrees is Slouching; otherwise lateral lean of minus 12 degrees or less is Leaning Left and plus 12 or more is Leaning Right; otherwise a total lean of 14 degrees or more, for example a diagonal lean or leaning back, is reported as Slouching; the small region inside all of these is Good. Right, the rule order the classifier evaluates on every frame: sensor error gives Unknown; EMG 80 ADC counts above the resting baseline gives High Tension before any angle is checked; a spinal flexion of 12 degrees between the two IMUs would give Lumbar Collapse but needs the disabled lower IMU; then the four angle rules, then Good. A state must hold for 750 milliseconds before it is reported.</desc>
