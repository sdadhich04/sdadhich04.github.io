<text transform="translate(18 180.8) rotate(-90)" text-anchor="middle" fill="#8C877D" font-family="JetBrains Mono, ui-monospace, monospace" font-size="10" letter-spacing="1">LATERAL LEAN (°) · + RIGHT</text>
<text x="348.0" y="180.8" text-anchor="middle" fill="#F2E9E4" font-size="10.5" font-weight="600">LEANING</text>
<text x="348.0" y="196.8" text-anchor="middle" fill="#F2E9E4" font-size="10.5" font-weight="600">FORWARD</text>
<text x="268.0" y="175.68" text-anchor="middle" fill="#F2E9E4" font-size="10.5" font-weight="600">SLOUCHING</text>
<text x="140.0" y="72.0" text-anchor="middle" fill="#F2E9E4" font-size="10.5" font-weight="600">LEANING RIGHT</text>
<text x="140.0" y="292.8" text-anchor="middle" fill="#F2E9E4" font-size="10.5" font-weight="600">LEANING LEFT</text>
<text x="156.0" y="175.68" text-anchor="middle" fill="#E8483A" font-size="12" font-weight="600">GOOD</text>
<text x="20" y="371.6" text-anchor="start" fill="#9C9389" font-size="10.5">Inside the dashed lines but outside the red outline (diagonal, or leaning back):</text>
<text x="20" y="385.6" text-anchor="start" fill="#9C9389" font-size="10.5">total lean ≥ 14°, reported as Slouching. Rules 3–7 use the upper IMU only.</text>
<text x="428" y="32" text-anchor="start" fill="#8C877D" font-size="10.5">RULE ORDER · EVALUATED EVERY FRAME</text>
<line x1="428" y1="38" x2="722" y2="38" stroke="#F2E9E4" stroke-opacity=".1"/>
<text x="428" y="52" fill="#8C877D" font-family="JetBrains Mono, ui-monospace, monospace" font-size="10">0</text>
<text x="450" y="52" fill="#F2E9E4" font-size="12.5" font-weight="600">Unknown</text>
<text x="450" y="66" fill="#9C9389" font-family="JetBrains Mono, ui-monospace, monospace" font-size="9.5">both IMUs invalid</text>
<line x1="428" y1="74" x2="722" y2="74" stroke="#F2E9E4" stroke-opacity=".1"/>
<text x="428" y="88" fill="#8C877D" font-family="JetBrains Mono, ui-monospace, monospace" font-size="10">1</text>
<text x="450" y="88" fill="#F2E9E4" font-size="12.5" font-weight="600">High tension</text>
<text x="450" y="102" fill="#9C9389" font-family="JetBrains Mono, ui-monospace, monospace" font-size="9.5">EMG ≥ baseline + 80 ADC counts · checked first</text>
<line x1="428" y1="110" x2="722" y2="110" stroke="#F2E9E4" stroke-opacity=".1"/>
<text x="428" y="124" fill="#8C877D" font-family="JetBrains Mono, ui-monospace, monospace" font-size="10">2</text>
<text x="450" y="124" fill="#8C877D" font-size="12.5" font-weight="600">Lumbar collapse</text>
<text x="450" y="138" fill="#8C877D" font-family="JetBrains Mono, ui-monospace, monospace" font-size="9.5">lower − upper pitch ≥ 12° · lower IMU is off</text>
<line x1="428" y1="146" x2="722" y2="146" stroke="#F2E9E4" stroke-opacity=".1"/>
<text x="428" y="160" fill="#8C877D" font-family="JetBrains Mono, ui-monospace, monospace" font-size="10">3</text>
<text x="450" y="160" fill="#F2E9E4" font-size="12.5" font-weight="600">Leaning forward</text>
<text x="450" y="174" fill="#9C9389" font-family="JetBrains Mono, ui-monospace, monospace" font-size="9.5">forward lean ≥ 25°</text>
<line x1="428" y1="182" x2="722" y2="182" stroke="#F2E9E4" stroke-opacity=".1"/>
<text x="428" y="196" fill="#8C877D" font-family="JetBrains Mono, ui-monospace, monospace" font-size="10">4</text>
<text x="450" y="196" fill="#F2E9E4" font-size="12.5" font-weight="600">Slouching</text>
<text x="450" y="210" fill="#9C9389" font-family="JetBrains Mono, ui-monospace, monospace" font-size="9.5">forward lean ≥ 10°</text>
<line x1="428" y1="218" x2="722" y2="218" stroke="#F2E9E4" stroke-opacity=".1"/>
<text x="428" y="232" fill="#8C877D" font-family="JetBrains Mono, ui-monospace, monospace" font-size="10">5</text>
<text x="450" y="232" fill="#F2E9E4" font-size="12.5" font-weight="600">Leaning left</text>
<text x="450" y="246" fill="#9C9389" font-family="JetBrains Mono, ui-monospace, monospace" font-size="9.5">lateral lean ≤ −12°</text>
