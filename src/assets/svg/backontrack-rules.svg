<text x="92.0" y="335.6" text-anchor="middle" fill="#8C877D" font-family="JetBrains Mono, ui-monospace, monospace" font-size="9.5">-10</text>
<text x="156.0" y="335.6" text-anchor="middle" fill="#8C877D" font-family="JetBrains Mono, ui-monospace, monospace" font-size="9.5">0</text>
<text x="220.0" y="335.6" text-anchor="middle" fill="#8C877D" font-family="JetBrains Mono, ui-monospace, monospace" font-size="9.5">10</text>
<text x="284.0" y="335.6" text-anchor="middle" fill="#8C877D" font-family="JetBrains Mono, ui-monospace, monospace" font-size="9.5">20</text>
<text x="316.0" y="335.6" text-anchor="middle" fill="#8C877D" font-family="JetBrains Mono, ui-monospace, monospace" font-size="9.5">25</text>
