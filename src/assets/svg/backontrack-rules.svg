<text x="450" y="354" fill="#9C9389" font-family="JetBrains Mono, ui-monospace, monospace" font-size="9.5">none of the above</text>
<text x="428" y="370" text-anchor="start" fill="#9C9389" font-size="11">A state is reported only after it holds for 750 ms.</text>
