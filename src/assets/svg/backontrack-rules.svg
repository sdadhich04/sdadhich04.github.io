<text x="428" y="268" fill="#8C877D" font-family="JetBrains Mono, ui-monospace, monospace" font-size="10">6</text>
<text x="450" y="268" fill="#F2E9E4" font-size="12.5" font-weight="600">Leaning right</text>
<text x="450" y="282" fill="#9C9389" font-family="JetBrains Mono, ui-monospace, monospace" font-size="9.5">lateral lean ≥ +12°</text>
<line x1="428" y1="290" x2="722" y2="290" stroke="#F2E9E4" stroke-opacity=".1"/>
<text x="428" y="304" fill="#8C877D" font-family="JetBrains Mono, ui-monospace, monospace" font-size="10">7</text>
<text x="450" y="304" fill="#F2E9E4" font-size="12.5" font-weight="600">Slouching</text>
<text x="450" y="318" fill="#9C9389" font-family="JetBrains Mono, ui-monospace, monospace" font-size="9.5">total lean ≥ 14° (diagonal, or leaning back)</text>
<line x1="428" y1="326" x2="722" y2="326" stroke="#F2E9E4" stroke-opacity=".1"/>
<text x="428" y="340" fill="#8C877D" font-family="JetBrains Mono, ui-monospace, monospace" font-size="10">—</text>
