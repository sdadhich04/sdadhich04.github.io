<svg xmlns="http://www.w3.org/2000/svg" width="100%" role="img" style="font-family:Inter, system-ui, sans-serif" viewBox="0 0 400 300" aria-labelledby="sc-confusion-t sc-confusion-d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="sc-confusion-t">SmartCrib: confusion matrix of the INT8 model at threshold 0.7</title><desc id="sc-confusion-d">On the 96 held-out test windows (48 cry, 48 non-cry) the INT8 model found 45 cry windows, missed 3, raised 2 false alarms and classified 46 non-cry windows correctly: recall 93.75%, precision 95.74%, accuracy 94.79%.</desc>
<text x="0" y="16" text-anchor="start" fill="#8C877D" font-family="JetBrains Mono, ui-monospace, monospace" font-size="11" letter-spacing="1.5">INT8 · THRESHOLD 0.7 · 96 TEST WINDOWS</text>
<text x="240" y="38" text-anchor="middle" fill="#8C877D" font-family="JetBrains Mono, ui-monospace, monospace" font-size="11" letter-spacing="1.5">PREDICTED</text>
<text x="175.0" y="56" text-anchor="middle" fill="#9C9389" font-family="JetBrains Mono, ui-monospace, monospace" font-size="12">cry</text>
<text x="305.0" y="56" text-anchor="middle" fill="#9C9389" font-family="JetBrains Mono, ui-monospace, monospace" font-size="12">non-cry</text>
<text x="24" y="154" transform="rotate(-90 24 154)" text-anchor="middle" fill="#8C877D" font-family="JetBrains Mono, ui-monospace, monospace" font-size="11" letter-spacing="1.5">ACTUAL</text>
<text x="100" y="113.0" text-anchor="end" fill="#9C9389" font-family="JetBrains Mono, ui-monospace, monospace" font-size="12">cry</text>
<text x="100" y="203.0" text-anchor="end" fill="#9C9389" font-family="JetBrains Mono, ui-monospace, monospace" font-size="12">non-cry</text>
<rect x="110" y="64" width="130" height="90" fill="none" stroke="#F2E9E4" stroke-opacity="0.3"/>
<text x="175.0" y="119.0" text-anchor="middle" fill="#F2E9E4" font-family="Big Shoulders Display, Inter, system-ui, sans-serif" font-size="40" font-weight="900"><title>true positives: 45</title>45</text>
<text x="175.0" y="144" text-anchor="middle" fill="#8C877D" font-family="JetBrains Mono, ui-monospace, monospace" font-size="10">true positives</text>
<rect x="240" y="64" width="130" height="90" fill="none" stroke="#F2E9E4" stroke-opacity="0.3"/>
<rect x="241" y="65" width="128" height="88" fill="none" stroke="#E8483A" stroke-width="2"><title>missed cries: 3</title></rect>
<text x="305.0" y="119.0" text-anchor="middle" fill="#E8483A" font-family="Big Shoulders Display, Inter, system-ui, sans-serif" font-size="40" font-weight="900"><title>missed cries: 3</title>3</text>
<text x="305.0" y="144" text-anchor="middle" fill="#E8483A" font-family="JetBrains Mono, ui-monospace, monospace" font-size="10">missed cries</text>
<rect x="110" y="154" width="130" height="90" fill="none" stroke="#F2E9E4" stroke-opacity="0.3"/>
<rect x="111" y="155" width="128" height="88" fill="none" stroke="#E8483A" stroke-width="2"><title>false alarms: 2</title></rect>
<text x="175.0" y="209.0" text-anchor="middle" fill="#E8483A" font-family="Big Shoulders Display, Inter, system-ui, sans-serif" font-size="40" font-weight="900"><title>false alarms: 2</title>2</text>
<text x="175.0" y="234" text-anchor="middle" fill="#E8483A" font-family="JetBrains Mono, ui-monospace, monospace" font-size="10">false alarms</text>
<rect x="240" y="154" width="130" height="90" fill="none" stroke="#F2E9E4" stroke-opacity="0.3"/>
<text x="305.0" y="209.0" text-anchor="middle" fill="#F2E9E4" font-family="Big Shoulders Display, Inter, system-ui, sans-serif" font-size="40" font-weight="900"><title>true negatives: 46</title>46</text>
<text x="305.0" y="234" text-anchor="middle" fill="#8C877D" font-family="JetBrains Mono, ui-monospace, monospace" font-size="10">true negatives</text>
<text x="0" y="274" text-anchor="start" fill="#9C9389" font-size="11.5" font-weight="400">48 cry + 48 non-cry windows from 20 held-out clips (public datasets).</text>
<text x="0" y="292" text-anchor="start" fill="#9C9389" font-size="11.5" font-weight="400">Recall 93.75% · precision 95.74% · accuracy 94.79%.</text>
