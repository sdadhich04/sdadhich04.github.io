<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="100%" role="img" aria-labelledby="emg-t emg-d" style="font-family:Inter, system-ui, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="emg-t">EMG cursor control: closed loop with an added feedback lag</title><desc id="emg-d">Two EMG channels arrive as a Lab Streaming Layer stream. Every 0.1 seconds MATLAB takes the mean absolute value of each channel, a three-state Kalman filter estimates cursor position, velocity and offset, a lag buffer delays the displayed state by 0, 100, 300 or 500 milliseconds, and the display shows a one-dimensional center-out task. The participant watches the cursor and changes muscle activity, closing the loop.</desc>
<defs><marker id="emg-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#F2EDE3" fill-opacity=".7"/></marker></defs>
<rect x="20" y="30" width="180" height="72" rx="2" fill="#171714" stroke="#F2EDE3" stroke-opacity="0.3"/>
<text x="30" y="51" fill="#F2EDE3" font-size="13.5" font-weight="600">2 EMG channels</text>
<text x="30" y="68" fill="#A9A398" font-family="JetBrains Mono, ui-monospace, monospace" font-size="10.5">Lab Streaming Layer</text>
<rect x="290" y="30" width="180" height="72" rx="2" fill="#171714" stroke="#F2EDE3" stroke-opacity="0.3"/>
<text x="300" y="51" fill="#F2EDE3" font-size="13.5" font-weight="600">Features</text>
<text x="300" y="68" fill="#A9A398" font-family="JetBrains Mono, ui-monospace, monospace" font-size="10.5">mean |EMG| / channel</text>
<text x="300" y="83" fill="#A9A398" font-family="JetBrains Mono, ui-monospace, monospace" font-size="10.5">every 0.1 s</text>
<rect x="560" y="30" width="180" height="72" rx="2" fill="#171714" stroke="#F2EDE3" stroke-opacity="0.3"/>
<text x="570" y="51" fill="#F2EDE3" font-size="13.5" font-weight="600">Kalman filter</text>
<text x="570" y="68" fill="#A9A398" font-family="JetBrains Mono, ui-monospace, monospace" font-size="10.5">position · velocity</text>
<text x="570" y="83" fill="#A9A398" font-family="JetBrains Mono, ui-monospace, monospace" font-size="10.5">· offset</text>
<rect x="560" y="190" width="180" height="80" rx="2" fill="#171714" stroke="#D2AE72" stroke-opacity="1"/>
<text x="570" y="206" fill="#D2AE72" font-family="JetBrains Mono, ui-monospace, monospace" font-size="9.5" letter-spacing="1">THE VARIABLE</text>
<text x="570" y="223" fill="#F2EDE3" font-size="13.5" font-weight="600">Lag buffer</text>
<text x="570" y="240" fill="#A9A398" font-family="JetBrains Mono, ui-monospace, monospace" font-size="10.5">LAG_T = 0 / 100 /</text>
<text x="570" y="255" fill="#A9A398" font-family="JetBrains Mono, ui-monospace, monospace" font-size="10.5">300 / 500 ms</text>
<rect x="290" y="190" width="180" height="80" rx="2" fill="#171714" stroke="#F2EDE3" stroke-opacity="0.3"/>
<text x="300" y="211" fill="#F2EDE3" font-size="13.5" font-weight="600">Display</text>
<text x="300" y="228" fill="#A9A398" font-family="JetBrains Mono, ui-monospace, monospace" font-size="10.5">1-D cursor · targets ±6</text>
<text x="300" y="243" fill="#A9A398" font-family="JetBrains Mono, ui-monospace, monospace" font-size="10.5">0.5 s hold · 5 s limit</text>
<rect x="20" y="190" width="180" height="80" rx="2" fill="#171714" stroke="#F2EDE3" stroke-opacity="0.3"/>
<text x="30" y="211" fill="#F2EDE3" font-size="13.5" font-weight="600">Participant</text>
<text x="30" y="228" fill="#A9A398" font-family="JetBrains Mono, ui-monospace, monospace" font-size="10.5">sees cursor,</text>
<text x="30" y="243" fill="#A9A398" font-family="JetBrains Mono, ui-monospace, monospace" font-size="10.5">adjusts muscle activity</text>
