<path d="M110,190 L110,104" fill="none" stroke="#F2EDE3" stroke-opacity=".6" stroke-width="1.3" marker-end="url(#emg-a)"/>
<text x="118" y="150" text-anchor="start" fill="#8C877D" font-family="JetBrains Mono, ui-monospace, monospace" font-size="10">muscle activity</text>
<text x="380" y="150" text-anchor="middle" fill="#8C877D" font-size="11">MATLAB · closed loop</text>
</svg>