<path d="M470,66 L558,66" fill="none" stroke="#F2EDE3" stroke-opacity=".6" stroke-width="1.3" marker-end="url(#emg-a)"/>
<path d="M650,102 L650,188" fill="none" stroke="#F2EDE3" stroke-opacity=".6" stroke-width="1.3" marker-end="url(#emg-a)"/>
<text x="658" y="150" text-anchor="start" fill="#8C877D" font-family="JetBrains Mono, ui-monospace, monospace" font-size="10">cursor state</text>
<path d="M560,230 L472,230" fill="none" stroke="#F2EDE3" stroke-opacity=".6" stroke-width="1.3" marker-end="url(#emg-a)"/>
<path d="M290,230 L202,230" fill="none" stroke="#F2EDE3" stroke-opacity=".6" stroke-width="1.3" marker-end="url(#emg-a)"/>
