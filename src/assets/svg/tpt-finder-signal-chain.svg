<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 384" width="100%" role="img" aria-labelledby="tpt-t tpt-d" style="font-family:Inter, system-ui, sans-serif">
<title id="tpt-t">TPT-Finder: the BioZ v2 two-electrode measurement chain</title><desc id="tpt-d">A Python GUI on a laptop talks over USB to an ESP32 running ESP-IDF firmware with the AD5933 I2C driver. On the BioZ v2 board, the AD5933 impedance converter, clocked by a 16 MHz oscillator, sends its excitation from VOUT through a 47 nF coupling capacitor, biased to mid-supply by a 49.9 kilohm divider, into channel A of an AD8606 wired as a unity buffer, which drives electrode E1. The current through the tissue returns on electrode E2 into channel B of the AD8606, a transimpedance stage with 49.9 kilohm feedback, then through a 20 kilohm input resistor (20 kilohm RFB) into the AD5933's VIN, where an on-chip DFT gives the real and imaginary parts. The same electrode pair drives and senses, so electrode contact impedance is part of every reading. Calibration against a 2200 ohm reference reached 0.034 percent error at 33 kHz.</desc>
