<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 440" width="100%" role="img" aria-labelledby="emgtask-t emgtask-d" style="font-family:Inter, system-ui, sans-serif">
<title id="emgtask-t">EMG BCI: the center-out task and how each trial ends</title><desc id="emgtask-d">The display is one-dimensional, from minus 10 to plus 10 units, with a center target and two peripheral targets at plus and minus 6, each 0.7 units in radius. Each trial waits 0.5 seconds, then the cursor must hold in the center for 0.5 seconds; leaving early is a failed center hold (code 9) and the trial restarts. At the go cue the user has 5 seconds to reach the target (otherwise a reach timeout, code 8), then must hold it for 0.5 seconds (leaving early is a target-hold failure, code 10). Only a reach that holds counts as a successful reach. A run has 20 trials, 10 to each target.</desc>
<defs><marker id="emgtask-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#F2E9E4" fill-opacity=".7"/></marker></defs>
<text x="10" y="16" text-anchor="start" fill="#8C877D" font-family="JetBrains Mono, ui-monospace, monospace" font-size="10.5" letter-spacing="1">DISPLAY: ONE DIMENSION, −10 TO +10</text>
<path d="M20,58 H440" stroke="#F2E9E4" stroke-opacity=".45"/>
<path d="M20.0,54 V62" stroke="#F2E9E4" stroke-opacity=".45"/>
<text x="20.0" y="78" text-anchor="middle" fill="#8C877D" font-family="JetBrains Mono, ui-monospace, monospace" font-size="9.5" letter-spacing="1">-10</text>
<path d="M104.0,54 V62" stroke="#F2E9E4" stroke-opacity=".45"/>
<text x="104.0" y="78" text-anchor="middle" fill="#8C877D" font-family="JetBrains Mono, ui-monospace, monospace" font-size="9.5" letter-spacing="1">-6</text>
<path d="M230.0,54 V62" stroke="#F2E9E4" stroke-opacity=".45"/>
<text x="230.0" y="78" text-anchor="middle" fill="#8C877D" font-family="JetBrains Mono, ui-monospace, monospace" font-size="9.5" letter-spacing="1">0</text>
<path d="M356.0,54 V62" stroke="#F2E9E4" stroke-opacity=".45"/>
<text x="356.0" y="78" text-anchor="middle" fill="#8C877D" font-family="JetBrains Mono, ui-monospace, monospace" font-size="9.5" letter-spacing="1">+6</text>
<path d="M440.0,54 V62" stroke="#F2E9E4" stroke-opacity=".45"/>
<text x="440.0" y="78" text-anchor="middle" fill="#8C877D" font-family="JetBrains Mono, ui-monospace, monospace" font-size="9.5" letter-spacing="1">+10</text>
<rect x="89.3" y="46" width="14.7" height="24" fill="none" stroke="#E8483A" stroke-opacity="0.9"/>
<text x="104.0" y="40" text-anchor="middle" fill="#E8483A" font-family="JetBrains Mono, ui-monospace, monospace" font-size="9.5" letter-spacing="1">target</text>
<rect x="215.3" y="46" width="14.7" height="24" fill="none" stroke="#F2E9E4" stroke-opacity="0.6"/>
<text x="230.0" y="40" text-anchor="middle" fill="#9C9389" font-family="JetBrains Mono, ui-monospace, monospace" font-size="9.5" letter-spacing="1">center</text>
<rect x="341.3" y="46" width="14.7" height="24" fill="none" stroke="#E8483A" stroke-opacity="0.9"/>
<text x="356.0" y="40" text-anchor="middle" fill="#E8483A" font-family="JetBrains Mono, ui-monospace, monospace" font-size="9.5" letter-spacing="1">target</text>
<text x="10" y="108" text-anchor="start" fill="#8C877D" font-family="JetBrains Mono, ui-monospace, monospace" font-size="10.5" letter-spacing="1">EVERY TRIAL (20 PER RUN, 10 TO EACH TARGET)</text>
<rect x="10" y="120" width="200" height="48" rx="2" fill="#000000" stroke="#F2E9E4" stroke-opacity="0.3"/>
<text x="20" y="141" fill="#F2E9E4" font-size="13.5" font-weight="600">Wait</text>
<text x="20" y="158" fill="#9C9389" font-family="JetBrains Mono, ui-monospace, monospace" font-size="10.5">0.5 s inter-trial interval</text>
<path d="M110,168 L110,178" fill="none" stroke="#F2E9E4" stroke-opacity=".6" stroke-width="1.3" marker-end="url(#emgtask-a)"/>
<rect x="10" y="178" width="200" height="48" rx="2" fill="#000000" stroke="#F2E9E4" stroke-opacity="0.3"/>
<text x="20" y="199" fill="#F2E9E4" font-size="13.5" font-weight="600">Hold center</text>
<text x="20" y="216" fill="#9C9389" font-family="JetBrains Mono, ui-monospace, monospace" font-size="10.5">0.5 s inside ±0.7</text>
<path d="M110,226 L110,236" fill="none" stroke="#F2E9E4" stroke-opacity=".6" stroke-width="1.3" marker-end="url(#emgtask-a)"/>
<rect x="250" y="178" width="200" height="48" rx="2" fill="none" stroke="#F2E9E4" stroke-opacity="0.3" stroke-dasharray="4 3"/>
<text x="260" y="199" fill="#8C877D" font-size="13.5" font-weight="600">Failed center hold</text>
<text x="260" y="216" fill="#8C877D" font-family="JetBrains Mono, ui-monospace, monospace" font-size="10.5">code 9 · trial restarts</text>
<path d="M210,202 L248,202" fill="none" stroke="#F2E9E4" stroke-opacity=".6" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#emgtask-a)"/>
<rect x="10" y="236" width="200" height="48" rx="2" fill="#000000" stroke="#F2E9E4" stroke-opacity="0.3"/>
<text x="20" y="257" fill="#F2E9E4" font-size="13.5" font-weight="600">Reach</text>
<text x="20" y="274" fill="#9C9389" font-family="JetBrains Mono, ui-monospace, monospace" font-size="10.5">go cue · up to 5 s</text>
<path d="M110,284 L110,294" fill="none" stroke="#F2E9E4" stroke-opacity=".6" stroke-width="1.3" marker-end="url(#emgtask-a)"/>
<rect x="250" y="236" width="200" height="48" rx="2" fill="none" stroke="#F2E9E4" stroke-opacity="0.3" stroke-dasharray="4 3"/>
<text x="260" y="257" fill="#8C877D" font-size="13.5" font-weight="600">Reach timeout</text>
<text x="260" y="274" fill="#8C877D" font-family="JetBrains Mono, ui-monospace, monospace" font-size="10.5">code 8</text>
<path d="M210,260 L248,260" fill="none" stroke="#F2E9E4" stroke-opacity=".6" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#emgtask-a)"/>
<rect x="10" y="294" width="200" height="48" rx="2" fill="#000000" stroke="#F2E9E4" stroke-opacity="0.3"/>
<text x="20" y="315" fill="#F2E9E4" font-size="13.5" font-weight="600">Hold target</text>
<text x="20" y="332" fill="#9C9389" font-family="JetBrains Mono, ui-monospace, monospace" font-size="10.5">0.5 s inside the target</text>
<path d="M110,342 L110,352" fill="none" stroke="#F2E9E4" stroke-opacity=".6" stroke-width="1.3" marker-end="url(#emgtask-a)"/>
<rect x="250" y="294" width="200" height="48" rx="2" fill="none" stroke="#F2E9E4" stroke-opacity="0.3" stroke-dasharray="4 3"/>
<text x="260" y="315" fill="#8C877D" font-size="13.5" font-weight="600">Target-hold failure</text>
<text x="260" y="332" fill="#8C877D" font-family="JetBrains Mono, ui-monospace, monospace" font-size="10.5">code 10</text>
<path d="M210,318 L248,318" fill="none" stroke="#F2E9E4" stroke-opacity=".6" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#emgtask-a)"/>
<rect x="10" y="352" width="200" height="48" rx="2" fill="#000000" stroke="#E8483A" stroke-opacity="1"/>
<text x="20" y="373" fill="#F2E9E4" font-size="13.5" font-weight="600">Successful reach</text>
<text x="20" y="390" fill="#9C9389" font-family="JetBrains Mono, ui-monospace, monospace" font-size="10.5">the only outcome that counts</text>
<text x="10" y="420" text-anchor="start" fill="#9C9389" font-size="11">Failed center holds are counted apart from reach</text>
<text x="10" y="436" text-anchor="start" fill="#9C9389" font-size="11">failures: they show instability before the reach.</text>
</svg>