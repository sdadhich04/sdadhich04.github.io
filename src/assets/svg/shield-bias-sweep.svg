<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 212" width="100%" role="img" aria-labelledby="shbias-t shbias-d" style="font-family:Inter, system-ui, sans-serif">
<title id="shbias-t">Project SHIELD: the 81-step bias-injection sweep</title><desc id="shbias-d">The firmware sequencer I wrote runs 81 bias-injection sessions from one boot: 3 trials, each covering 9 axes at 3 severities. Bias values are registers the sequencer sets per step; an NVS checkpoint after each step makes the sweep resume-safe after a power cycle, and every run writes a b4_meta.json sidecar with its axis, severity, trial, step index, status and firmware commit.</desc>
