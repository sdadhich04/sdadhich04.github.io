<text x="440" y="146" text-anchor="middle" fill="#F2E9E4" font-size="10.5"></text>
<rect x="546" y="152" width="28" height="10" fill="none" stroke="#F2E9E4" stroke-opacity=".6"/>
<text x="560" y="146" text-anchor="middle" fill="#F2E9E4" font-size="10.5"></text>
<rect x="626" y="152" width="28" height="10" fill="none" stroke="#F2E9E4" stroke-opacity=".6"/>
<text x="640" y="146" text-anchor="middle" fill="#F2E9E4" font-size="10.5"></text>
<rect x="706" y="152" width="28" height="10" fill="none" stroke="#F2E9E4" stroke-opacity=".6"/>
<text x="720" y="146" text-anchor="middle" fill="#F2E9E4" font-size="10.5"></text>
<text x="422" y="146" text-anchor="end" fill="#F2E9E4" font-size="10">OUT1</text>
<text x="542" y="146" text-anchor="end" fill="#F2E9E4" font-size="10">IN1</text>
<text x="622" y="146" text-anchor="end" fill="#F2E9E4" font-size="10">IN2</text>
<text x="702" y="146" text-anchor="end" fill="#F2E9E4" font-size="10">OUT2</text>
<path d="M720,152 V134" fill="none" stroke="#F2E9E4" stroke-opacity=".6" stroke-width="1.3"/><path d="M712,134 H728 M715,130 H725 M718,126 H722" stroke="#F2E9E4" stroke-opacity=".6" stroke-width="1.3"/>
<text x="732" y="134" text-anchor="start" fill="#8C877D" font-size="10">GND</text>
<polyline points="440.0,162.0 445.0,166.2 435.0,174.8 445.0,183.2 435.0,191.8 440.0,196.0" fill="none" stroke="#F2E9E4" stroke-opacity=".55" stroke-width="1.2"/>
<polyline points="560.0,162.0 565.0,166.2 555.0,174.8 565.0,183.2 555.0,191.8 560.0,196.0" fill="none" stroke="#F2E9E4" stroke-opacity=".55" stroke-width="1.2"/>
<polyline points="640.0,162.0 645.0,166.2 635.0,174.8 645.0,183.2 635.0,191.8 640.0,196.0" fill="none" stroke="#F2E9E4" stroke-opacity=".55" stroke-width="1.2"/>
<polyline points="720.0,162.0 725.0,166.2 715.0,174.8 725.0,183.2 715.0,191.8 720.0,196.0" fill="none" stroke="#F2E9E4" stroke-opacity=".55" stroke-width="1.2"/>
<rect x="400" y="196" width="340" height="56" rx="2" fill="#000000" stroke="#F2E9E4" stroke-opacity="0.3"/>
<text x="410" y="217" fill="#F2E9E4" font-size="13.5" font-weight="600"></text>
<text x="732" y="244" text-anchor="end" fill="#8C877D" font-size="10.5">TISSUE</text>
<path d="M440,204 C470,250 690,250 720,204" fill="none" stroke="#F2E9E4" stroke-opacity=".6" stroke-width="1.3" stroke-dasharray="4 3"/>
<text x="400" y="276" text-anchor="start" fill="#9C9389" font-size="11.5">The outer pair carries the current; the inner pair</text>
<text x="400" y="293" text-anchor="start" fill="#9C9389" font-size="11.5">senses the voltage and carries almost none, so its</text>
<text x="400" y="310" text-anchor="start" fill="#9C9389" font-size="11.5">contact impedance stays out of the measured voltage.</text>
</svg>