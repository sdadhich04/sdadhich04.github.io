<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="100%" role="img" aria-labelledby="emgdec-t emgdec-d" style="font-family:Inter, system-ui, sans-serif">
<title id="emgdec-t">EMG BCI: what the Kalman decoder does during one reach</title><desc id="emgdec-d">One successful reach toward the +6 target in the zero-lag run, about 6 seconds. Top: the two scaled EMG channels the filter uses as its measurement. Middle: the decoded velocity, pushed up by channel 1 and down by channel 2. Bottom: the cursor position, which integrates the velocity, leaves the center at the go cue, enters the target band at 5.3 to 6.7 units and holds there for half a second until the trial succeeds.</desc>
