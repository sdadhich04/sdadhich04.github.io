<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="100%" role="img" aria-labelledby="bot-t bot-d" style="font-family:Inter, system-ui, sans-serif">
<title id="bot-t">BackOnTrack: wearable posture firmware on an ESP32-S3</title><desc id="bot-d">A BNO085 IMU on the upper back over SPI and a MyoWare 2.0 EMG sensor on the ADC feed FreeRTOS tasks and queues on an ESP32-S3. A processing task calibrates, computes posture features, runs a rule-based classifier with good posture plus five fault states, and keeps session statistics. Outputs: a NimBLE GATT packet to a desktop receiver that logs CSV, and serial CSV or JSON telemetry. A second lower-back IMU is configured but disabled at runtime.</desc>
