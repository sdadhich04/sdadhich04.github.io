<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 384" width="100%" role="img" aria-labelledby="shrtos-t shrtos-d" style="font-family:Inter, system-ui, sans-serif">
<title id="shrtos-t">Project SHIELD: the dual-core FreeRTOS acquisition pipeline</title><desc id="shrtos-d">Redrawn from the capstone poster's Figure 2. On core 0, three acquisition tasks poll the sensors in three tiers: FastTask at priority 10 runs a 1 millisecond loop for the BNO085 accelerometer, gyroscope and magnetometer, the SW-420 and the INMP441 (1 kHz); MediumTask at priority 8 runs a 5 millisecond loop for the ACS723 current sensor and the photodiode through the ADS1115 (200 Hz); SlowTask at priority 6 runs a 20 millisecond loop for the MPL3115A2 pressure and MCP9808 temperature sensors (50 Hz). Each task pushes records into its own FreeRTOS queue. On core 1, a single SDWriter task at priority 5 drains the three queues into 16 KB per-file buffers, flushes every second or when a buffer is full, and updates the metadata every 60 seconds, writing fast_data.bin, medium_data.bin, slow_data.bin, meta.json and events.log to a run folder on the microSD card. A live streamer sends the data over USB serial to pc_viewer.py on the PC. Every stored sample is written as raw plus processed 20-byte V2 records.</desc>
