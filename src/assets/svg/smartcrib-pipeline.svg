<rect x="16" y="34" width="132" height="88" rx="2" fill="#171714" stroke="#F2EDE3" stroke-opacity="0.3"/>
<text x="26" y="55" fill="#F2EDE3" font-size="13.5" font-weight="600">Datasets</text>
