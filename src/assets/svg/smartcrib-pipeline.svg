<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="100%" role="img" aria-labelledby="sc-t sc-d" style="font-family:Inter, system-ui, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="sc-t">SmartCrib: training pipeline and on-device cry detection</title><desc id="sc-d">Offline: Donate-a-Cry cry clips and ESC-50 negatives become 40-frame by 13-coefficient MFCC features, train a compact Conv1D model, which is quantized to an 7.4 kB INT8 TensorFlow Lite model, and a threshold sweep picks 0.7 to meet a 0.90 recall target. On device: an Arduino Nano 33 BLE Sense records from its PDM microphone, computes MFCCs for each one-second window, runs the INT8 model, applies the threshold and a three-window majority vote, and raises a GPIO alert to an ESP32 bridge that sounds a buzzer and exposes a BLE alert.</desc>
<defs><marker id="sc-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#F2EDE3" fill-opacity=".7"/></marker></defs>
<rect x="6" y="8" width="748" height="124" rx="2" fill="none" stroke="#F2EDE3" stroke-opacity=".22" stroke-dasharray="4 4"/>
