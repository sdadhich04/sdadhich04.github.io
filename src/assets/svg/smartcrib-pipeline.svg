<text x="26" y="87" fill="#A9A398" font-family="JetBrains Mono, ui-monospace, monospace" font-size="10.5">ESC-50: negatives</text>
<rect x="176" y="34" width="120" height="88" rx="2" fill="#171714" stroke="#F2EDE3" stroke-opacity="0.3"/>
<text x="186" y="55" fill="#F2EDE3" font-size="13.5" font-weight="600">MFCC</text>
<text x="186" y="72" fill="#A9A398" font-family="JetBrains Mono, ui-monospace, monospace" font-size="10.5">40 frames</text>
<text x="186" y="87" fill="#A9A398" font-family="JetBrains Mono, ui-monospace, monospace" font-size="10.5">× 13 coeffs</text>
<rect x="322" y="34" width="120" height="88" rx="2" fill="#171714" stroke="#F2EDE3" stroke-opacity="0.3"/>
<text x="332" y="55" fill="#F2EDE3" font-size="13.5" font-weight="600">Conv1D model</text>
<text x="332" y="72" fill="#A9A398" font-family="JetBrains Mono, ui-monospace, monospace" font-size="10.5">Keras</text>
<text x="332" y="87" fill="#A9A398" font-family="JetBrains Mono, ui-monospace, monospace" font-size="10.5">compact CNN</text>
<rect x="468" y="34" width="128" height="88" rx="2" fill="#171714" stroke="#D2AE72" stroke-opacity="1"/>
<text x="478" y="55" fill="#F2EDE3" font-size="13.5" font-weight="600">INT8 TFLite</text>
<text x="478" y="72" fill="#A9A398" font-family="JetBrains Mono, ui-monospace, monospace" font-size="10.5">12.5 → 7.4 kB</text>
<text x="478" y="87" fill="#A9A398" font-family="JetBrains Mono, ui-monospace, monospace" font-size="10.5">same accuracy</text>
<rect x="622" y="34" width="124" height="88" rx="2" fill="#171714" stroke="#F2EDE3" stroke-opacity="0.3"/>
<text x="632" y="55" fill="#F2EDE3" font-size="13.5" font-weight="600">Threshold</text>
<text x="632" y="72" fill="#A9A398" font-family="JetBrains Mono, ui-monospace, monospace" font-size="10.5">0.7: fewest false</text>
<text x="632" y="87" fill="#A9A398" font-family="JetBrains Mono, ui-monospace, monospace" font-size="10.5">alarms at recall</text>
<text x="632" y="102" fill="#A9A398" font-family="JetBrains Mono, ui-monospace, monospace" font-size="10.5">≥ 0.90</text>
