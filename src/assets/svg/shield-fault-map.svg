<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 500" width="100%" role="img" aria-labelledby="shfault-t shfault-d" style="font-family:Inter, system-ui, sans-serif">
<title id="shfault-t">Project SHIELD: faults, stress sessions and the rigs that run them</title><desc id="shfault-d">From the capstone poster's Fault Injection panel: software faults to inject are bias, drift, burst noise, dropouts, stuck-at, clipping and latency; hardware faults are power variation, EMI or analog noise, and bus disturbance; the goal is to compare fault behaviour against the nominal baseline and produce a labelled dataset for fault detection and machine learning. In the ARC Lab stress campaign, bias injection runs on my 81-step firmware sequencer, vibration sessions run on the orbital shaker driven by my PC scripts, EMI sessions use the Faraday cage I designed and built, and thermal sessions use the team's setup.</desc>
