<svg xmlns="http://www.w3.org/2000/svg" width="100%" role="img" style="font-family:Inter, system-ui, sans-serif" viewBox="0 0 460 400" aria-labelledby="sc-tflite-ops-t sc-tflite-ops-d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="sc-tflite-ops-t">SmartCrib: why the Conv1D model was rebuilt as a Conv2D-equivalent graph</title><desc id="sc-tflite-ops-d">The standard Conv1D export wraps each convolution in EXPAND_DIMS operations, which the Arduino TensorFlowLite 2.4.0-ALPHA library does not support. The converter was rebuilt to emit a graph of six supported operators with the same trained weights: input 40 by 1 by 13, CONV_2D with a 3 by 1 kernel and 16 filters, MAX_POOL_2D, CONV_2D with 32 filters, MEAN (global average pooling), FULLY_CONNECTED to two classes and SOFTMAX. Operator list and shapes read from the INT8 .tflite file.</desc>
<defs><marker id="sc-ops-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#F2E9E4" fill-opacity=".7"/></marker></defs>
<text x="0" y="16" text-anchor="start" fill="#8C877D" font-family="JetBrains Mono, ui-monospace, monospace" font-size="11" letter-spacing="1.5">STANDARD CONV1D EXPORT (LEFT) · REBUILT GRAPH (RIGHT)</text>
<rect x="0" y="30" width="190" height="40" rx="2" fill="#000000" stroke="#F2E9E4" stroke-opacity="0.3"/>
<text x="10" y="48" fill="#F2E9E4" font-size="12.5" font-weight="600">Input 40 × 13</text>
<text x="10" y="63" fill="#9C9389" font-family="JetBrains Mono, ui-monospace, monospace" font-size="10">MFCC frames × coefficients</text>
<path d="M95.0,70 L95.0,84" fill="none" stroke="#F2E9E4" stroke-opacity=".6" stroke-width="1.3" marker-end="url(#sc-ops-a)"/>
<rect x="0" y="86" width="190" height="40" rx="2" fill="#000000" stroke="#E8483A" stroke-opacity="1" stroke-width="1.5"/>
<text x="10" y="104" fill="#E8483A" font-size="12.5" font-weight="600">EXPAND_DIMS</text>
<text x="10" y="119" fill="#9C9389" font-family="JetBrains Mono, ui-monospace, monospace" font-size="10">inserted around each Conv1D</text>
<path d="M95.0,126 L95.0,140" fill="none" stroke="#F2E9E4" stroke-opacity=".6" stroke-width="1.3" marker-end="url(#sc-ops-a)"/>
<rect x="0" y="142" width="190" height="40" rx="2" fill="#000000" stroke="#F2E9E4" stroke-opacity="0.3" stroke-dasharray="4 3"/>
<text x="10" y="160" fill="#F2E9E4" font-size="12.5" font-weight="600">Conv1D ×2 …</text>
<text x="10" y="175" fill="#9C9389" font-family="JetBrains Mono, ui-monospace, monospace" font-size="10">as Conv2D + squeeze</text>
<text x="0" y="206" fill="#E8483A" font-family="JetBrains Mono, ui-monospace, monospace" font-size="10.5">✗ not in Arduino TensorFlowLite</text>
<text x="0" y="220" fill="#E8483A" font-family="JetBrains Mono, ui-monospace, monospace" font-size="10.5">  2.4.0-ALPHA's op list</text>
<text x="0" y="244" fill="#9C9389" font-size="11.5">Fix: rebuild the graph in Keras with</text>
<text x="0" y="259" fill="#9C9389" font-size="11.5">4-D tensors and copy the trained</text>
<text x="0" y="274" fill="#9C9389" font-size="11.5">weights across (kernel 3 → 3 × 1).</text>
<path d="M198,150 L234,150" fill="none" stroke="#F2E9E4" stroke-opacity=".6" stroke-width="1.3" marker-end="url(#sc-ops-a)"/>
<rect x="250" y="30" width="210" height="40" rx="2" fill="#000000" stroke="#F2E9E4" stroke-opacity="0.3"/>
<text x="260" y="48" fill="#F2E9E4" font-size="12.5" font-weight="600">Input 40 × 1 × 13</text>
<text x="260" y="63" fill="#9C9389" font-family="JetBrains Mono, ui-monospace, monospace" font-size="10">int8, same MFCCs</text>
<path d="M355.0,70 L355.0,82" fill="none" stroke="#F2E9E4" stroke-opacity=".6" stroke-width="1.3" marker-end="url(#sc-ops-a)"/>
<rect x="250" y="82" width="210" height="40" rx="2" fill="#000000" stroke="#F2E9E4" stroke-opacity="0.3"/>
<text x="260" y="100" fill="#F2E9E4" font-size="12.5" font-weight="600">CONV_2D</text>
<text x="260" y="115" fill="#9C9389" font-family="JetBrains Mono, ui-monospace, monospace" font-size="10">3×1 kernel · 16 filters → 38×1×16</text>
<path d="M355.0,122 L355.0,134" fill="none" stroke="#F2E9E4" stroke-opacity=".6" stroke-width="1.3" marker-end="url(#sc-ops-a)"/>
<rect x="250" y="134" width="210" height="40" rx="2" fill="#000000" stroke="#F2E9E4" stroke-opacity="0.3"/>
<text x="260" y="152" fill="#F2E9E4" font-size="12.5" font-weight="600">MAX_POOL_2D</text>
<text x="260" y="167" fill="#9C9389" font-family="JetBrains Mono, ui-monospace, monospace" font-size="10">2×1 → 19×1×16</text>
<path d="M355.0,174 L355.0,186" fill="none" stroke="#F2E9E4" stroke-opacity=".6" stroke-width="1.3" marker-end="url(#sc-ops-a)"/>
<rect x="250" y="186" width="210" height="40" rx="2" fill="#000000" stroke="#F2E9E4" stroke-opacity="0.3"/>
<text x="260" y="204" fill="#F2E9E4" font-size="12.5" font-weight="600">CONV_2D</text>
<text x="260" y="219" fill="#9C9389" font-family="JetBrains Mono, ui-monospace, monospace" font-size="10">3×1 kernel · 32 filters → 17×1×32</text>
<path d="M355.0,226 L355.0,238" fill="none" stroke="#F2E9E4" stroke-opacity=".6" stroke-width="1.3" marker-end="url(#sc-ops-a)"/>
<rect x="250" y="238" width="210" height="40" rx="2" fill="#000000" stroke="#F2E9E4" stroke-opacity="0.3"/>
<text x="260" y="256" fill="#F2E9E4" font-size="12.5" font-weight="600">MEAN</text>
<text x="260" y="271" fill="#9C9389" font-family="JetBrains Mono, ui-monospace, monospace" font-size="10">global average → 32</text>
<path d="M355.0,278 L355.0,290" fill="none" stroke="#F2E9E4" stroke-opacity=".6" stroke-width="1.3" marker-end="url(#sc-ops-a)"/>
<rect x="250" y="290" width="210" height="40" rx="2" fill="#000000" stroke="#F2E9E4" stroke-opacity="0.3"/>
<text x="260" y="308" fill="#F2E9E4" font-size="12.5" font-weight="600">FULLY_CONNECTED</text>
<text x="260" y="323" fill="#9C9389" font-family="JetBrains Mono, ui-monospace, monospace" font-size="10">32 → 2</text>
<path d="M355.0,330 L355.0,342" fill="none" stroke="#F2E9E4" stroke-opacity=".6" stroke-width="1.3" marker-end="url(#sc-ops-a)"/>
<rect x="250" y="342" width="210" height="40" rx="2" fill="#000000" stroke="#E8483A" stroke-opacity="1" stroke-width="1.5"/>
<text x="260" y="360" fill="#E8483A" font-size="12.5" font-weight="600">SOFTMAX</text>
<text x="260" y="375" fill="#9C9389" font-family="JetBrains Mono, ui-monospace, monospace" font-size="10">P(non-cry), P(cry)</text>
</svg>
