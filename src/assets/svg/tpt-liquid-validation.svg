<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 372" width="100%" role="img" aria-labelledby="tptliq-t tptliq-d" style="font-family:Inter, system-ui, sans-serif">
<title id="tptliq-t">TPT-Finder, BioZ v2: impedance and phase of four liquids at 33 kHz</title><desc id="tptliq-d">Mean ± standard deviation at 33 kHz, measured on the two-electrode BioZ v2 board on 12 February 2026. Distilled water, n = 11: |Z| 207,667 ± 19,990 ohms, phase 45.5 ± 7.8 degrees; Drinking water, n = 15: |Z| 12,294 ± 646 ohms, phase 3.4 ± 0.4 degrees; Gatorade, n = 21: |Z| 616 ± 3 ohms, phase -1.5 ± 0.1 degrees; Saline, n = 10: |Z| 592 ± 0 ohms, phase 6.1 ± 0.0 degrees. Impedance falls by more than two orders of magnitude from distilled water to Gatorade and saline, tracking conductivity.</desc>
<text x="70.0" y="18.0" text-anchor="start" fill="#8C877D" font-family="JetBrains Mono, ui-monospace, monospace" font-size="11" letter-spacing="1.5">|Z|, OHMS (LOG SCALE)</text>
