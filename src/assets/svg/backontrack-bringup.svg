<text x="36" y="217.5" text-anchor="middle" fill="#E8483A" font-family="JetBrains Mono, ui-monospace, monospace" font-size="9.5">4</text>
<text x="58" y="215" fill="#E8483A" font-size="12.5" font-weight="600">Parser</text>
<text x="58" y="230" fill="#9C9389" font-family="JetBrains Mono, ui-monospace, monospace" font-size="9.5">wrong feature flags and report ID · fixed 9 Jun 2026</text>
<circle cx="36" cy="272" r="9" fill="#000000" stroke="#F2E9E4" stroke-opacity="0.6" stroke-width="1.4"/>
<text x="36" y="275.5" text-anchor="middle" fill="#F2E9E4" font-family="JetBrains Mono, ui-monospace, monospace" font-size="9.5">5</text>
<text x="58" y="273" fill="#F2E9E4" font-size="12.5" font-weight="600">Bundled esp32_BNO08x library</text>
<text x="58" y="288" fill="#9C9389" font-family="JetBrains Mono, ui-monospace, monospace" font-size="9.5">adopted the same day · MIT, Myles Parfeniuk</text>
