<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 392" width="100%" role="img" aria-labelledby="botimu-t botimu-d" style="font-family:Inter, system-ui, sans-serif">
<title id="botimu-t">BackOnTrack: how the IMU bring-up fault was run down</title><desc id="botimu-d">Six steps. One: both BNO085s return valid part numbers, but calibration fails and every posture value stays at zero. Two: wiring, interrupt and reset lines and the SPI transport are verified, so the hardware is ruled out. Three: comparing against a standalone diagnostic app, iterated six times, shows the diagnostic resets the sensor and drains its boot packets before enabling the Game Rotation Vector report; copying that sequence makes the sensor stream channel-3 reports. Four: values still read zero, so the fault has moved to parsing: wrong feature flags and report ID, fixed on 9 June 2026. Five: the same day the firmware switches to the bundled esp32_BNO08x library. Six: that library is single-instance, which is what left the lower-back IMU disabled.</desc>
<defs><marker id="botimu-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#F2E9E4" fill-opacity=".7"/></marker></defs>
