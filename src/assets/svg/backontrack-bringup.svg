<text x="58" y="99" fill="#F2E9E4" font-size="12.5" font-weight="600">Hardware and SPI verified</text>
<text x="58" y="114" fill="#9C9389" font-family="JetBrains Mono, ui-monospace, monospace" font-size="9.5">INT, RST, wiring, part-number exchange · ruled out</text>
<circle cx="36" cy="156" r="9" fill="#000000" stroke="#F2E9E4" stroke-opacity="0.6" stroke-width="1.4"/>
<text x="36" y="159.5" text-anchor="middle" fill="#F2E9E4" font-family="JetBrains Mono, ui-monospace, monospace" font-size="9.5">3</text>
<text x="58" y="157" fill="#F2E9E4" font-size="12.5" font-weight="600">Compare with imu_diag (6 iterations)</text>
<text x="58" y="172" fill="#9C9389" font-family="JetBrains Mono, ui-monospace, monospace" font-size="9.5">reset + drain boot packets before enabling GRV → streaming</text>
