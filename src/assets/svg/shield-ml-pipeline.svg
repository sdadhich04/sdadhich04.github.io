<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 296" width="100%" role="img" aria-labelledby="shml-t shml-d" style="font-family:Inter, system-ui, sans-serif">
<title id="shml-t">Project SHIELD: the team's machine-learning pipeline design</title><desc id="shml-d">Redrawn from the capstone poster's Figure 5. Raw sensor telemetry is cut into fixed-length windows and labelled using synthetically injected faults with randomized onsets and severities; each window becomes a feature vector of time-domain statistics, frequency-domain spectral features and wavelet coefficients; classification models are trained to tell healthy sensor behaviour from fault conditions. The requirements set the final target: predict a failure at least 20 seconds before functional loss.</desc>
