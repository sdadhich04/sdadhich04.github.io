<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 236" width="100%" role="img" aria-labelledby="emgsess-t emgsess-d" style="font-family:Inter, system-ui, sans-serif">
<title id="emgsess-t">EMG BCI: the recording session on 3 March 2026</title><desc id="emgsess-d">All five runs were recorded in one session, within about 45 minutes, in this order: zero lag, about 125 ms, about 590 ms, about 360 ms, then position control. 0 ms from 17:18 to 17:21; ≈125 ms from 17:37 to 17:40; ≈590 ms from 17:43 to 17:52; ≈360 ms from 17:55 to 18:01; position from 18:02 to 18:05. The order was not counterbalanced.</desc>
<text x="10.0" y="16.0" text-anchor="start" fill="#8C877D" font-family="JetBrains Mono, ui-monospace, monospace" font-size="10.5" letter-spacing="1.2">3 MARCH 2026, ONE SESSION, IN THIS ORDER</text>
<line x1="168.0" y1="150.0" x2="448.0" y2="150.0" stroke="#F2E9E4" stroke-opacity="0.3"/>
