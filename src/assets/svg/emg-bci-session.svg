<text x="10.0" y="196.0" text-anchor="start" fill="#9C9389" font-size="11.5">Runs end at their save time; start = end − summed loop time.</text>
<text x="10.0" y="214.0" text-anchor="start" fill="#9C9389" font-size="11.5">The two high-lag runs came 25–40 minutes in, so lag can't be</text>
