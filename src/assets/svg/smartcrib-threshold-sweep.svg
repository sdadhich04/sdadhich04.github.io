<svg xmlns="http://www.w3.org/2000/svg" width="100%" role="img" style="font-family:Inter, system-ui, sans-serif" viewBox="0 0 720 330" aria-labelledby="sc-threshold-sweep-t sc-threshold-sweep-d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="sc-threshold-sweep-t">SmartCrib: threshold sweep on the 96 held-out windows, why 0.7 was picked</title><desc id="sc-threshold-sweep-d">Cry recall and cry precision of the INT8 TensorFlow Lite model at decision thresholds 0.3 to 0.7 on the 96 held-out test windows, with the float32 model as hollow reference points. Recall is 97.9% at 0.3 to 0.5, 95.8% at 0.6 and 93.75% at 0.7; precision rises from 83.9% at 0.3 to 95.7% at 0.7. The target line is cry recall of at least 0.90; 0.7 is the highest threshold that still meets it, with the fewest false alarms (2 of 48 non-cry windows) and 3 missed cry windows.</desc>
<text x="0" y="16" text-anchor="start" fill="#8C877D" font-family="JetBrains Mono, ui-monospace, monospace" font-size="11" letter-spacing="1.5">INT8 MODEL ON THE 96 TEST WINDOWS · CRY RECALL AND PRECISION BY THRESHOLD</text>
