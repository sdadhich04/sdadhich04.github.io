<svg xmlns="http://www.w3.org/2000/svg" width="100%" role="img" style="font-family:Inter, system-ui, sans-serif" viewBox="0 0 440 250" aria-labelledby="sc-memory-budget-t sc-memory-budget-d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="sc-memory-budget-t">SmartCrib: how much of the Nano 33 BLE Sense the model uses</title><desc id="sc-memory-budget-d">Against the board's 1 MB flash and 256 KB SRAM: the INT8 model is 7,392 bytes (0.7% of flash); the sketch allocates a 60 KB tensor arena (23.4% of SRAM) of which the INT8 graph is estimated to need 27,648 bytes; the float32 model's estimated arena would have been 56,320 bytes (21% of SRAM). Arena figures are the repo's host-side estimates.</desc>
<text x="0" y="16" text-anchor="start" fill="#8C877D" font-family="JetBrains Mono, ui-monospace, monospace" font-size="11" letter-spacing="1.5">NANO 33 BLE SENSE (nRF52840) · MEMORY BUDGET</text>
<text x="0" y="34" text-anchor="start" fill="#8C877D" font-family="JetBrains Mono, ui-monospace, monospace" font-size="11" letter-spacing="1.5">FLASH · INT8 MODEL</text>
<rect x="0" y="44" width="310" height="18" fill="none" stroke="#F2E9E4" stroke-opacity="0.3"/>
<rect x="0.0" y="44" width="2.2" height="18" fill="#E8483A" fill-opacity="1"><title>INT8 model: 7,392 bytes = 0.7% of 1 MB</title></rect>
<text x="318" y="57" text-anchor="start" fill="#9C9389" font-family="JetBrains Mono, ui-monospace, monospace" font-size="11">1 MB</text>
<text x="0" y="78" text-anchor="start" fill="#9C9389" font-size="11.5" font-weight="400">INT8 model 7.4 kB = 0.7% of flash (target: under 100 KB)</text>
<text x="0" y="108" text-anchor="start" fill="#8C877D" font-family="JetBrains Mono, ui-monospace, monospace" font-size="11" letter-spacing="1.5">SRAM · TENSOR ARENA</text>
<rect x="0" y="118" width="310" height="18" fill="none" stroke="#F2E9E4" stroke-opacity="0.3"/>
<rect x="0.0" y="118" width="32.7" height="18" fill="#E8483A" fill-opacity="1"><title>estimated INT8 arena: 27,648 bytes = 10.5% of 256 KB</title></rect>
<rect x="34.7" y="118" width="40.0" height="18" fill="#F2E9E4" fill-opacity="0.45"><title>headroom inside the 60 KB arena the sketch allocates: 33,792 bytes</title></rect>
<text x="318" y="131" text-anchor="start" fill="#9C9389" font-family="JetBrains Mono, ui-monospace, monospace" font-size="11">256 KB</text>
<text x="0" y="152" text-anchor="start" fill="#9C9389" font-size="11.5" font-weight="400">60 KB allocated (23% of SRAM); INT8 graph est. 27.6 kB (red)</text>
<text x="0" y="182" text-anchor="start" fill="#8C877D" font-family="JetBrains Mono, ui-monospace, monospace" font-size="11" letter-spacing="1.5">SRAM · IF FLOAT32 HAD SHIPPED</text>
<rect x="0" y="192" width="310" height="18" fill="none" stroke="#F2E9E4" stroke-opacity="0.3"/>
<rect x="0.0" y="192" width="66.6" height="18" fill="#F2E9E4" fill-opacity="0.45"><title>estimated float32 arena: 56,320 bytes = 21.5% of 256 KB</title></rect>
<text x="318" y="205" text-anchor="start" fill="#9C9389" font-family="JetBrains Mono, ui-monospace, monospace" font-size="11">256 KB</text>
<text x="0" y="226" text-anchor="start" fill="#9C9389" font-size="11.5" font-weight="400">float32 arena est. 56.3 kB (21% of SRAM), about twice INT8</text>
</svg>
